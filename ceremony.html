<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D000 — Cérémonie d'Initiation V0.1</title>
<style>
:root{--ink:#e8e5dc;--muted:#77766f;--line:rgba(232,229,220,.16);--accent:#d9d4c7}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:var(--ink);font-family:"Courier New",monospace;overflow:hidden}
body{touch-action:manipulation}
#stage{position:fixed;inset:0;background:#000;isolation:isolate}
#grain{position:absolute;inset:-50%;opacity:.035;pointer-events:none;background-image:repeating-radial-gradient(circle at 30% 20%,#fff 0 1px,transparent 1px 4px);animation:grain 8s steps(10) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(3%,-2%)}50%{transform:translate(-2%,3%)}75%{transform:translate(1%,2%)}100%{transform:translate(0,0)}}
.geometry{position:absolute;left:50%;top:50%;width:min(76vw,76vh);aspect-ratio:1;transform:translate(-50%,-50%);opacity:0;transition:opacity 2.4s ease}
.geometry:before,.geometry:after{content:"";position:absolute;inset:0;border:1px solid var(--line);border-radius:50%;animation:rot 38s linear infinite}
.geometry:after{inset:12%;border-style:dashed;animation-direction:reverse;animation-duration:52s}
@keyframes rot{to{transform:rotate(360deg)}}
.cross{position:absolute;inset:0;opacity:.13}
.cross:before,.cross:after{content:"";position:absolute;background:#ddd}
.cross:before{width:1px;height:100%;left:50%}
.cross:after{height:1px;width:100%;top:50%}
#symbols{position:absolute;inset:0}
.symbol{position:absolute;left:50%;top:50%;width:min(28vw,28vh);aspect-ratio:1;transform:translate(-50%,-50%) scale(.74);opacity:0;filter:drop-shadow(0 0 18px rgba(255,255,255,.12));transition:opacity 2s ease,transform 3.2s cubic-bezier(.2,.7,.1,1),left 3s ease,top 3s ease}
.symbol img,.order img{width:100%;height:100%;object-fit:contain}
.symbol.show{opacity:.92;transform:translate(-50%,-50%) scale(1)}
.symbol.orbit{width:min(19vw,19vh);opacity:.7}
#s1.orbit{left:50%;top:23%} #s2.orbit{left:75%;top:42%} #s3.orbit{left:66%;top:72%} #s4.orbit{left:34%;top:72%} #s5.orbit{left:25%;top:42%}
.symbol.converge{left:50%!important;top:50%!important;transform:translate(-50%,-50%) scale(.18) rotate(22deg);opacity:0;transition-duration:3.5s}
.order{position:absolute;left:50%;top:50%;width:min(54vw,54vh);transform:translate(-50%,-50%) scale(.82);opacity:0;transition:opacity 3s ease,transform 4s cubic-bezier(.12,.8,.18,1);filter:drop-shadow(0 0 24px rgba(255,255,255,.13))}
.order.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#caption{position:absolute;left:50%;bottom:8vh;transform:translateX(-50%);width:min(88vw,900px);text-align:center;letter-spacing:.25em;font-size:clamp(11px,1.25vw,17px);opacity:0;transition:opacity 1.2s ease;text-transform:uppercase}
#caption.show{opacity:.82}
#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1.3s ease}
#status.show{opacity:1}
.statusbox{width:min(86vw,680px);border-top:1px solid #5e5d58;border-bottom:1px solid #5e5d58;padding:26px 12px;text-align:left}
.row{display:flex;justify-content:space-between;gap:20px;padding:7px 0;letter-spacing:.12em;font-size:clamp(11px,1.5vw,17px)}
.row span:first-child{color:#777}
#division{font-weight:bold}
#finalLogo{position:absolute;left:50%;top:31%;width:min(32vw,32vh);transform:translate(-50%,-50%);opacity:0;transition:opacity 1.5s ease;filter:drop-shadow(0 0 25px color-mix(in srgb,var(--accent) 35%,transparent))}
#finalLogo.show{opacity:1}
#intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:50}
.panel{width:min(88vw,720px);padding:30px;border:1px solid #343434;background:#050505}
.kicker{font-size:11px;letter-spacing:.25em;color:#777;margin-bottom:12px}
h1{font-size:clamp(19px,3vw,31px);font-weight:normal;letter-spacing:.12em;margin:0 0 12px}
p{color:#8f8e88;line-height:1.55;font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
button,select{background:#090909;color:#d8d6ce;border:1px solid #444;padding:11px 13px;font:12px "Courier New",monospace;letter-spacing:.08em}
button:hover{border-color:#aaa}
#testbar{position:fixed;top:10px;right:10px;z-index:60;display:none;gap:6px;opacity:.55}
#testbar:hover{opacity:1}
#testbar button{padding:7px 9px;font-size:10px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .75s ease-out}
@keyframes flash{0%{opacity:0}20%{opacity:.13}100%{opacity:0}}
@media(max-width:650px){.symbol{width:min(42vw,28vh)}.symbol.orbit{width:min(28vw,18vh)}.order{width:min(78vw,48vh)}.row{letter-spacing:.06em}}

/* V0.2 — mise en scène avancée */
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 30%,rgba(0,0,0,.34) 68%,rgba(0,0,0,.86) 100%);z-index:8}
#sweep{position:absolute;left:50%;top:50%;width:min(90vw,90vh);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;opacity:0;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 83%,rgba(255,255,255,.08) 87%,transparent 91%);mix-blend-mode:screen}
#sweep.go{opacity:.55;animation:sweep 7s linear infinite}@keyframes sweep{to{transform:translate(-50%,-50%) rotate(360deg)}}
.symbol:before,.symbol:after{content:"";position:absolute;inset:4%;border-radius:50%;opacity:0;pointer-events:none}
.symbol.awake:before{border:1px solid rgba(255,255,255,.16);animation:ringbirth 2.6s ease-out}
.symbol.awake:after{inset:-9%;border:1px dashed rgba(255,255,255,.10);animation:ringbirth 3.4s ease-out reverse}
@keyframes ringbirth{0%{opacity:0;transform:scale(.55) rotate(-20deg)}35%{opacity:.8}100%{opacity:0;transform:scale(1.25) rotate(35deg)}}
#s1.awake img{animation:eyeIn 3.5s ease-out}@keyframes eyeIn{0%{clip-path:inset(48% 0 48% 0);filter:blur(7px)}55%{clip-path:inset(0 0 0 0);filter:blur(0)}}
#s2.awake img{animation:flameIn 3.2s cubic-bezier(.2,.9,.2,1)}@keyframes flameIn{0%{clip-path:inset(100% 0 0 0);transform:scaleY(.35)}70%{clip-path:inset(0);transform:scaleY(1.08)}100%{transform:scaleY(1)}}
#s3.awake img{animation:handIn 3.2s steps(12)}@keyframes handIn{0%{opacity:.05;transform:translateY(14px)}25%{opacity:.3}45%{opacity:.1}55%{opacity:.7}100%{opacity:1;transform:none}}
#s4.awake img{animation:spiralIn 4.5s cubic-bezier(.1,.8,.2,1)}@keyframes spiralIn{0%{opacity:0;transform:rotate(-130deg) scale(.3)}100%{opacity:1;transform:rotate(0) scale(1)}}
#s5.awake img{animation:hourIn 4.2s ease-out}@keyframes hourIn{0%{opacity:0;transform:scaleY(1.35);filter:blur(12px)}35%{opacity:.35}60%{opacity:.15}100%{opacity:1;transform:scaleY(1);filter:none}}
.order.reveal{animation:orderReveal 6s cubic-bezier(.12,.8,.18,1) forwards}
@keyframes orderReveal{0%{opacity:0;transform:translate(-50%,-50%) scale(.5);filter:blur(18px) drop-shadow(0 0 0 #fff)}
22%{opacity:.18;filter:blur(5px) drop-shadow(0 0 30px rgba(255,255,255,.5))}
48%{opacity:.95;transform:translate(-50%,-50%) scale(1.08);filter:blur(0) drop-shadow(0 0 55px rgba(255,255,255,.2))}
100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:drop-shadow(0 0 24px rgba(255,255,255,.13))}}
#sealrings{position:absolute;left:50%;top:50%;width:min(65vw,65vh);aspect-ratio:1;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
#sealrings:before,#sealrings:after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.18);border-radius:50%}
#sealrings:after{inset:10%;border-style:dotted}
#sealrings.show{opacity:1;animation:seal 5.5s ease-out}@keyframes seal{0%{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(-55deg)}30%{opacity:.7}100%{opacity:.2;transform:translate(-50%,-50%) scale(1) rotate(0)}}

/* V0.3 — emblèmes officiels couleur + fin sans superposition */
.symbol img,.order img{filter:none!important;mix-blend-mode:screen}
.symbol{transition:opacity 1.15s ease,transform 1.55s cubic-bezier(.18,.75,.18,1)}
.symbol.vanish{opacity:0!important;transform:translate(-50%,-50%) scale(.18)!important}
.order{transition:opacity 1.25s ease,transform 1.4s ease}
.order.exit{opacity:0!important;transform:translate(-50%,-50%) scale(.82)!important}
#divisionFinal{
 position:absolute;left:50%;top:43%;width:min(32vw,32vh);aspect-ratio:1;
 transform:translate(-50%,-50%) scale(.78);opacity:0;z-index:7;
 transition:opacity 1.3s ease,transform 1.6s cubic-bezier(.18,.8,.18,1);
 pointer-events:none
}
#divisionFinal img{width:100%;height:100%;object-fit:contain;filter:none;mix-blend-mode:screen}
#divisionFinal.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#finalPanel{z-index:9}

/* V0.3.3 — fluidité restaurée */
.symbol{transition:left 5.2s cubic-bezier(.16,.72,.18,1),top 5.2s cubic-bezier(.16,.72,.18,1),transform 5.2s cubic-bezier(.16,.72,.18,1),opacity 2.8s ease!important}
.symbol.converge{left:50%!important;top:50%!important;transform:translate(-50%,-50%) scale(.52)!important;opacity:.95!important}
.symbol.vanish,.symbol.softvanish{left:50%!important;top:50%!important;transform:translate(-50%,-50%) scale(.20)!important;opacity:0!important}
.order{transition:opacity 4.8s ease,transform 5.2s cubic-bezier(.16,.72,.18,1)!important}
.order.exit,.order.slowexit{opacity:0!important;transform:translate(-50%,-50%) scale(.90)!important}
#geo{transition:opacity 3.5s ease}

/* V0.7 — LE SCEAU DES CINQ */
#geo.five-seal{position:absolute;left:50%;top:50%;width:min(78vmin,760px);height:min(78vmin,760px);transform:translate(-50%,-50%);opacity:0;transition:opacity 3.2s ease}
#geo.five-seal:before,#geo.five-seal:after{display:none}
#geo.five-seal .seal-circle{position:absolute;left:50%;top:50%;border:1px solid rgba(238,241,239,.10);border-radius:50%;transform:translate(-50%,-50%);transition:opacity 2.4s ease,transform 4s ease}
#geo.five-seal .outer{width:88%;height:88%;opacity:.38}
#geo.five-seal .inner{width:43%;height:43%;opacity:.22;border-style:dashed}
#geo.five-seal .seal-axis{position:absolute;left:50%;top:50%;width:1px;height:43%;transform-origin:50% 0;background:linear-gradient(to bottom,rgba(238,241,239,.18),rgba(238,241,239,.018));opacity:.055;transition:opacity 2.4s ease,filter 2.4s ease}
#geo.five-seal .a1{transform:rotate(0deg)} #geo.five-seal .a2{transform:rotate(72deg)} #geo.five-seal .a3{transform:rotate(144deg)} #geo.five-seal .a4{transform:rotate(216deg)} #geo.five-seal .a5{transform:rotate(288deg)}
#geo.five-seal .seal-node{position:absolute;width:7px;height:7px;border:1px solid rgba(238,241,239,.22);border-radius:50%;opacity:.08;transition:opacity 2.4s ease,box-shadow 2.4s ease}
#geo.five-seal .n1{left:49.5%;top:5%} #geo.five-seal .n2{left:91.5%;top:35%} #geo.five-seal .n3{left:76%;top:84%} #geo.five-seal .n4{left:22%;top:84%} #geo.five-seal .n5{left:6%;top:35%}
#geo.five-seal .seal-core{position:absolute;left:50%;top:50%;width:10px;height:10px;border:1px solid rgba(238,241,239,.20);transform:translate(-50%,-50%) rotate(45deg);opacity:.16;transition:opacity 2.4s ease,transform 3.5s ease}
#geo.five-seal.stage1 .a1,#geo.five-seal.stage1 .n1,
#geo.five-seal.stage2 .a1,#geo.five-seal.stage2 .n1,#geo.five-seal.stage2 .a2,#geo.five-seal.stage2 .n2,
#geo.five-seal.stage3 .a1,#geo.five-seal.stage3 .n1,#geo.five-seal.stage3 .a2,#geo.five-seal.stage3 .n2,#geo.five-seal.stage3 .a3,#geo.five-seal.stage3 .n3,
#geo.five-seal.stage4 .a1,#geo.five-seal.stage4 .n1,#geo.five-seal.stage4 .a2,#geo.five-seal.stage4 .n2,#geo.five-seal.stage4 .a3,#geo.five-seal.stage4 .n3,#geo.five-seal.stage4 .a4,#geo.five-seal.stage4 .n4,
#geo.five-seal.stage5 .seal-axis,#geo.five-seal.stage5 .seal-node{opacity:.68;filter:drop-shadow(0 0 4px rgba(255,255,255,.10))}
#geo.five-seal.complete .outer{opacity:.68;transform:translate(-50%,-50%) scale(1.025)}
#geo.five-seal.complete .inner{opacity:.48;transform:translate(-50%,-50%) scale(.975)}
#geo.five-seal.complete .seal-core{opacity:.7;transform:translate(-50%,-50%) rotate(225deg) scale(1.22)}
#caption{max-width:min(86vw,900px);letter-spacing:.15em;line-height:1.65;font-size:clamp(12px,1.35vw,17px);font-weight:400;text-shadow:0 0 18px rgba(255,255,255,.10)}

#sweep{display:none!important}

/* V0.7.1 — CONSTRUCTION DE L'ORDRE */
#geo.order-field{position:absolute;left:50%;top:50%;width:min(94vmin,980px);height:min(78vmin,820px);transform:translate(-50%,-50%);opacity:0;transition:opacity 3s ease,transform 5s ease;overflow:visible}
#geo.order-field:before,#geo.order-field:after{display:none}
.field-grid{position:absolute;inset:5%;opacity:.38;background-image:linear-gradient(rgba(238,241,239,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(238,241,239,.045) 1px,transparent 1px);background-size:7.5% 10%;mask-image:radial-gradient(ellipse at center,#000 18%,rgba(0,0,0,.8) 54%,transparent 84%)}
.field-grid:before,.field-grid:after{content:"";position:absolute;inset:9% 11%;border:1px solid rgba(238,241,239,.07);transform:skewX(-7deg) rotate(-3deg)}
.field-grid:after{inset:19% 21%;transform:skewY(5deg) rotate(8deg);opacity:.65}
.field-arc{position:absolute;left:50%;top:50%;border:1px solid rgba(238,241,239,.075);border-radius:50%;transform:translate(-50%,-50%);opacity:.4;transition:all 3s ease}
.arc1{width:80%;height:80%}.arc2{width:49%;height:49%;border-style:dashed;opacity:.24}
.division-layer{position:absolute;inset:0;opacity:0;transition:opacity 2.2s ease}
.order-field.stage1 .eye,.order-field.stage2 .eye,.order-field.stage2 .flame,.order-field.stage3 .eye,.order-field.stage3 .flame,.order-field.stage3 .hand,.order-field.stage4 .eye,.order-field.stage4 .flame,.order-field.stage4 .hand,.order-field.stage4 .spiral,.order-field.stage5 .division-layer{opacity:1}
.sight,.route,.branch,.trace,.contain,.point{position:absolute;display:block}
.eye .sight{height:1px;background:linear-gradient(90deg,transparent,rgba(225,240,255,.32),transparent)}
.eye .h1{left:8%;top:36%;width:84%;transform:rotate(-7deg)}.eye .h2{left:14%;top:63%;width:72%;transform:rotate(5deg)}
.eye .v1{left:52%;top:14%;width:1px;height:68%;background:linear-gradient(transparent,rgba(225,240,255,.28),transparent)}
.eye .point{width:5px;height:5px;border:1px solid rgba(225,240,255,.45);border-radius:50%;box-shadow:0 0 9px rgba(225,240,255,.16)}
.eye .p1{left:22%;top:40%}.eye .p2{left:57%;top:31%}.eye .p3{left:72%;top:59%}
.flame .route{height:1px;width:48%;left:27%;top:48%;background:linear-gradient(90deg,transparent,rgba(255,120,100,.31),transparent);transform-origin:center}
.flame .r1{transform:rotate(18deg)}.flame .r2{transform:rotate(-18deg)}.flame .r3{transform:rotate(180deg) translateY(18px);opacity:.7}
.hand .branch{height:1px;width:38%;left:50%;top:50%;transform-origin:left center;background:linear-gradient(90deg,rgba(220,205,135,.31),transparent)}
.hand .b1{transform:rotate(-42deg)}.hand .b2{transform:rotate(-14deg)}.hand .b3{transform:rotate(18deg)}.hand .b4{transform:rotate(47deg)}
.spiral .trace{left:50%;top:50%;border:1px solid rgba(175,215,185,.20);border-radius:50%;transform:translate(-50%,-50%)}
.spiral .t1{width:31%;height:31%;opacity:.85}.spiral .t2{width:49%;height:49%;opacity:.55}.spiral .t3{width:67%;height:67%;opacity:.3}
.hourglass .contain{left:50%;top:50%;border:1px solid rgba(180,155,225,.22);border-radius:50%;transform:translate(-50%,-50%)}
.hourglass .c1{width:87%;height:87%}.hourglass .c2{width:73%;height:73%;border-style:dashed}.hourglass .c3{width:59%;height:59%;opacity:.65}
.field-core{position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid rgba(245,245,245,.28);transform:translate(-50%,-50%) rotate(45deg);opacity:.4;transition:all 3s ease}
.order-field.complete .field-core{transform:translate(-50%,-50%) rotate(225deg) scale(1.45);opacity:.85}
.order-field.complete .field-arc{opacity:.7}
.order-field.complete{transform:translate(-50%,-50%) scale(.985)}


/* V0.7.2 — PRÉSENCE INITIALE
   Le décor existe avant les Divisions : profondeur, architecture et respiration.
   Aucun radar, aucune rotation continue. */
#geo.order-field{
  width:min(108vmin,1120px);
  height:min(88vmin,900px);
}
#geo.order-field .field-grid{
  opacity:.56;
  background-size:7.5% 10%;
  filter:drop-shadow(0 0 10px rgba(255,255,255,.025));
}
#geo.order-field .field-grid:before{
  border-color:rgba(238,241,239,.105);
}
#geo.order-field .field-grid:after{
  border-color:rgba(238,241,239,.075);
}
#geo.order-field .field-arc.arc1{opacity:.56;border-color:rgba(238,241,239,.105)}
#geo.order-field .field-arc.arc2{opacity:.36;border-color:rgba(238,241,239,.085)}
#geo.order-field .field-core{
  opacity:.58;
  box-shadow:0 0 18px rgba(255,255,255,.055);
}

/* Architecture secondaire, créée sans nouveau HTML */
#geo.order-field:before{
  display:block;
  content:"";
  position:absolute;
  left:50%;top:50%;
  width:94%;height:72%;
  transform:translate(-50%,-50%) rotate(-2deg);
  border-top:1px solid rgba(238,241,239,.055);
  border-bottom:1px solid rgba(238,241,239,.055);
  background:
    linear-gradient(90deg,transparent 7%,rgba(238,241,239,.055) 7.1%,transparent 7.25%),
    linear-gradient(90deg,transparent 92%,rgba(238,241,239,.055) 92.1%,transparent 92.25%);
  opacity:.8;
  pointer-events:none;
}
#geo.order-field:after{
  display:block;
  content:"OCI // CONTINUITÉ     05 AXES     ÉTAT : STABLE";
  position:absolute;
  left:50%;bottom:4%;
  transform:translateX(-50%);
  width:76%;
  padding-top:8px;
  border-top:1px solid rgba(238,241,239,.065);
  color:rgba(238,241,239,.16);
  font:9px/1.4 monospace;
  letter-spacing:.22em;
  text-align:center;
  white-space:nowrap;
  opacity:.75;
  pointer-events:none;
}

/* Une respiration très lente : l'écran paraît vivant, jamais agité. */
@keyframes orderBreath{
  0%,100%{opacity:.48;filter:brightness(.88)}
  50%{opacity:.66;filter:brightness(1.08)}
}
@keyframes coreBreath{
  0%,100%{box-shadow:0 0 10px rgba(255,255,255,.035)}
  50%{box-shadow:0 0 25px rgba(255,255,255,.085)}
}
#geo.order-field.opening-presence{
  animation:orderBreath 9s ease-in-out infinite;
}
#geo.order-field.opening-presence .field-core{
  animation:coreBreath 6.5s ease-in-out infinite;
}

/* Dès qu'une Division intervient, sa transformation reste dominante. */
#geo.order-field.stage1,#geo.order-field.stage2,#geo.order-field.stage3,
#geo.order-field.stage4,#geo.order-field.stage5{
  animation:none;
  opacity:.64!important;
}


/* V0.8 — ARCHITECTURE DES CINQ
   Chaque Division construit une partie indispensable d'une même machine visuelle. */

/* On neutralise les anciennes couches décoratives de V0.7.x. */
#geo.order-field .division-layer{opacity:0!important}
#geo.order-field.stage1 .division-layer,
#geo.order-field.stage2 .division-layer,
#geo.order-field.stage3 .division-layer,
#geo.order-field.stage4 .division-layer,
#geo.order-field.stage5 .division-layer{opacity:0!important}

/* Le réseau initial devient le support architectural. */
#geo.order-field .field-grid{opacity:.42}
#geo.order-field .field-arc{transition:opacity 2s ease,transform 3.8s cubic-bezier(.2,.7,.2,1),border-color 2s ease}
#geo.order-field .field-core{z-index:8}

/* Cinq éléments structurels sont dessinés avec pseudo-éléments/ombres.
   Ils convergent tous vers le même centre : une rosace institutionnelle à cinq branches. */
#geo.order-field .eye,
#geo.order-field .flame,
#geo.order-field .hand,
#geo.order-field .spiral,
#geo.order-field .hourglass{
 display:block!important;position:absolute;inset:0;opacity:0!important;
 transition:opacity 2.2s ease,transform 3.2s cubic-bezier(.2,.75,.2,1);
}

/* ŒIL — établit l'axe et le cercle de lecture */
#geo.order-field.stage1 .eye,
#geo.order-field.stage2 .eye,#geo.order-field.stage3 .eye,#geo.order-field.stage4 .eye,#geo.order-field.stage5 .eye{opacity:1!important}
#geo.order-field .eye:before{
 content:"";position:absolute;left:50%;top:50%;width:68%;height:68%;
 transform:translate(-50%,-50%);
 border:1px solid rgba(210,232,255,.30);border-radius:50%;
 box-shadow:inset 0 0 35px rgba(210,232,255,.025),0 0 18px rgba(210,232,255,.025);
}
#geo.order-field .eye:after{
 content:"";position:absolute;left:50%;top:10%;width:1px;height:80%;
 background:linear-gradient(transparent,rgba(210,232,255,.34) 25%,rgba(210,232,255,.34) 75%,transparent);
}

/* FLAMME — crée le second axe, diagonal et son contre-axe */
#geo.order-field.stage2 .flame,#geo.order-field.stage3 .flame,#geo.order-field.stage4 .flame,#geo.order-field.stage5 .flame{opacity:1!important}
#geo.order-field .flame:before,#geo.order-field .flame:after{
 content:"";position:absolute;left:50%;top:50%;width:1px;height:76%;transform-origin:50% 50%;

/* V1.3.4 — corrections ciblées */

/* Les anneaux entourent le logo sans jamais le traverser.

const energy={
 canvas:null,ctx:null,w:0,h:0,dpr:1,active:0,phase:"flow",start:0,raf:0,
 colors:["#cfe9ff","#ff5d42","#ffd45e","#83d59a","#a978e8"],born:[0,0,0,0,0],
 resize(){
   this.dpr=Math.min(window.devicePixelRatio||1,2);
   this.w=innerWidth;this.h=innerHeight;
   this.canvas.width=this.w*this.dpr;this.canvas.height=this.h*this.dpr;
   this.canvas.style.width=this.w+"px";this.canvas.style.height=this.h+"px";
   this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
 },
 init(){
   this.canvas=document.getElementById("energyCanvas");this.ctx=this.canvas.getContext("2d");
   this.resize();window.addEventListener("resize",()=>this.resize());
   this.start=performance.now();this.loop();
 },
 add(i){
   this.active=Math.max(this.active,i);
   if(!this.born[i-1])this.born[i-1]=performance.now();
   this.canvas.classList.add("on")
 },
 fuse(){this.phase="fuse";this.fuseAt=performance.now()},
 burst(){
   this.phase="burst";this.burstAt=performance.now();
   revealOrderRingsAfterExplosion();
   this.active=0;
   this.canvas.classList.remove("on");
 },
 clear(){this.active=0;this.born=[0,0,0,0,0];this.phase="flow";this.canvas&&this.canvas.classList.remove("on")},
 curve(i,t,offset){
   const ctx=this.ctx,w=this.w,h=this.h,cx=w/2,cy=h/2;
   const amp=h*(.075+.009*i);
   const ybase=h*(.38+i*.058);
   const dir=i%2?1:-1;
   const drift=Math.sin(t*.00034+i*1.15+offset)*w*.020;
   ctx.beginPath();
   for(let x=-40;x<=w+40;x+=18){
     const u=x/w;
     let y=ybase
       +Math.sin(u*Math.PI*2.0+t*.00115*dir+i*.82+offset)*amp
       +Math.sin(u*Math.PI*4.2-t*.00062+i)*amp*.24;
     let xx=x+drift*Math.sin(u*Math.PI);
     if(this.phase==="fuse"){
       const q=Math.min(1,(performance.now()-this.fuseAt)/5200);
       const pull=Math.sin(u*Math.PI)*q;
       xx=xx+(cx-xx)*pull*.68;
       y=y+(cy-y)*pull*.82;
     }
     if(x===-40)ctx.moveTo(xx,y);else ctx.lineTo(xx,y);
   }
   ctx.stroke();
 },
 loop(){
   const ctx=this.ctx,t=performance.now();
   ctx.clearRect(0,0,this.w,this.h);
   ctx.globalCompositeOperation="lighter";
   for(let i=0;i<this.active;i++){
     const col=this.colors[i];
     const born=this.born[i]||t;
     const entrance=Math.max(0,Math.min(1,(t-born)/4200));
     const soft=entrance*entrance*(3-2*entrance);
     ctx.save(); ctx.globalAlpha=soft;
     for(let k=0;k<4;k++){
       ctx.save();
       ctx.strokeStyle=col;
       ctx.globalAlpha=k===0?.25:(.095-k*.012);
       ctx.lineWidth=k===0?1.25:3+k*2.4;
       ctx.shadowColor=col;ctx.shadowBlur=k===0?10:15;
       this.curve(i,t,k*.48);
       ctx.restore();
     }
     // traveling sparks riding each flow
     for(let n=0;n<7;n++){
       const u=((t*.000055*(1+i*.08)+n/7+i*.13)%1);
       const x=u*this.w;
       const amp=this.h*(.075+.009*i), ybase=this.h*(.38+i*.058);
       const y=ybase+Math.sin(u*Math.PI*2+t*.00115*(i%2?1:-1)+i*.82)*amp;
       ctx.fillStyle=col;ctx.globalAlpha=.20;
       ctx.beginPath();ctx.arc(x,y,1.2+(n%3)*.35,0,Math.PI*2);ctx.fill();
     }
     ctx.restore();
   }
   if(this.phase==="burst"){
     const q=(t-this.burstAt)/1000,cx=this.w/2,cy=this.h/2;
     if(q<1.3){
       const a=Math.max(0,1-q/1.3);
       const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(this.w,this.h)*.32*q);
       g.addColorStop(0,`rgba(255,255,255,${.95*a})`);
       g.addColorStop(.12,`rgba(255,255,255,${.48*a})`);
       g.addColorStop(1,"rgba(255,255,255,0)");
       ctx.fillStyle=g;ctx.fillRect(0,0,this.w,this.h);
     }
     for(let r=0;r<4;r++){
       const age=q-r*.13;
       if(age>0&&age<2.4){
         ctx.beginPath();ctx.arc(cx,cy,age*Math.min(this.w,this.h)*.19,0,Math.PI*2);
         ctx.strokeStyle="rgba(245,247,246,"+(Math.max(0,.65-age*.25))+")";
         ctx.lineWidth=1.4;ctx.shadowColor="#fff";ctx.shadowBlur=12;ctx.stroke();
       }
     }
   }
   this.raf=requestAnimationFrame(()=>this.loop());
 }
};

 // Charnière : les cinq deviennent l'Ordre
 later(135000,()=>{$("geo").className="geometry order-field stage5 complete";cap("SÉPARÉES, ELLES SONT CINQ.",4500)});
 later(143000,()=>{

 // Partie III : apogée. Plus aucune narration.
 later(151000,()=>{
   $("flash").classList.remove("go"); void $("flash").offsetWidth; $("flash").classList.add("go");
   energy.burst();

$("order").classList.add("show","reveal");$("geo").style.opacity=.14;
 });

 // L'emblème reste seul pendant tout l'apogée, puis commence sa disparition
 // sur la vraie redescente finale du morceau.
 later(198000,()=>{
   $("geo").style.opacity=.08;

   /* Fondu piloté image par image par le navigateur.
      On part de l'état ACTUEL, sans ajouter une classe qui impose opacity:0. */
   const orderEl=$("order");
   const ringsEl=$("sealrings");

   orderEl.classList.remove("order-depart","final-fade","exit");
   ringsEl.classList.remove("order-depart","final-fade");

   const orderOpacity=parseFloat(getComputedStyle(orderEl).opacity)||1;
   const ringsOpacity=parseFloat(getComputedStyle(ringsEl).opacity)||1;

   orderEl.animate(
     [
       {opacity:orderOpacity,filter:"blur(0px) brightness(1)",transform:"translate(-50%,-50%) scale(1)"},
       {opacity:orderOpacity*.72,offset:.38},
       {opacity:orderOpacity*.32,filter:"blur(.5px) brightness(.88)",offset:.72},
       {opacity:0,filter:"blur(2px) brightness(.72)",transform:"translate(-50%,-50%) scale(.975)"}
     ],
     {duration:7000,easing:"cubic-bezier(.32,0,.22,1)",fill:"forwards"}
   );

   ringsEl.animate(
     [
       {opacity:ringsOpacity,filter:"blur(0px)",transform:"translate(-50%,-50%) scale(1)"},
       {opacity:ringsOpacity*.68,offset:.42},
       {opacity:ringsOpacity*.28,offset:.76},
       {opacity:0,filter:"blur(1.6px)",transform:"translate(-50%,-50%) scale(1.045)"}
     ],
     {duration:7200,easing:"cubic-bezier(.32,0,.22,1)",fill:"forwards"}
   );

   /* Verrouillage définitif de fin : aucune animation ultérieure ne peut
      faire réapparaître les anneaux ou le logo. */
   const lockFinalVisual=()=>{
     /* Le fondu est terminé : on détruit tous les états animés AVANT le noir. */
     [ringsEl,orderEl].forEach(el=>{
       if(el.getAnimations) el.getAnimations({subtree:true}).forEach(a=>a.cancel());
       el.classList.add("ceremony-ended");
       el.style.setProperty("opacity","0","important");
       el.style.setProperty("visibility","hidden","important");
       el.style.setProperty("display","none","important");
     });
   };
   /* Verrou avant toute transition d'écran suivante. */
   setTimeout(lockFinalVisual,6750);
 });

 // Fin musicale ~209.7 s : noir absolu, puis respiration.

   $("geo").style.opacity=0;
 });

let __ociPayload={};
try{__ociPayload=JSON.parse(sessionStorage.getItem("OCI_CEREMONY_PAYLOAD")||"{}")}catch(e){}
function __ociDivisionKey(name){
 const n=(name||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
 if(n.includes("OEIL"))return"oeil"; if(n.includes("FLAMME"))return"flamme";
 if(n.includes("MAIN"))return"main"; if(n.includes("SPIRALE"))return"spirale";
 if(n.includes("SABLIER"))return"sablier"; return"oeil";
}
try{
 if(__ociPayload && __ociPayload.matricule) document.body.classList.add("oci-terminal-flow");
 selected=__ociDivisionKey(__ociPayload.division);
 $("choice").value=selected;
 $("mat").textContent=__ociPayload.matricule||"OCI-26-XXXXX";
}catch(e){}

try{
 const __enter=$("ociEnter");
 if(__enter && document.body.classList.contains("oci-terminal-flow")){
   __enter.onclick=()=>{
     selected=__ociDivisionKey(__ociPayload.division);
     const a=$("theme");
     if(audioTestTimer){clearTimeout(audioTestTimer);audioTestTimer=null;}
     a.pause();a.currentTime=0;a.muted=false;a.volume=1;
     // Visual timeline begins on the exact same user gesture as audio.
     document.body.classList.add("oci-started");
     const p=a.play();
     ceremony();
     if(p && p.catch) p.catch(e=>console.warn("Audio ceremony:",e));
   };
 }
}catch(e){}
